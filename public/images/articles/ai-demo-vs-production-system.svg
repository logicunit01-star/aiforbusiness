<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="demoHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="prodHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="225" x2="1200" y2="225" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="150" y1="0" x2="150" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="450" y1="0" x2="450" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="750" y1="0" x2="750" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1050" y1="0" x2="1050" y2="675" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(60, 40)">
    <!-- Pill -->
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="12" cy="13" r="4" fill="#3b82f6" />
    <text x="24" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SYSTEM COMPARISON</text>

    <!-- Title -->
    <text x="0" y="54" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">AI Demo Prototype vs. Production AI System</text>
    <text x="0" y="78" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Why a prototype only proves technical possibility — while 85% of engineering lies in operational reality.</text>
  </g>

  <!-- Left Card: AI Demo / Prototype -->
  <g transform="translate(60, 140)">
    <!-- Card Base -->
    <rect width="520" height="440" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />
    <!-- Header Area -->
    <rect width="520" height="68" rx="16" fill="url(#demoHeader)" />
    <path d="M 0 68 L 520 68" stroke="#334155" stroke-width="1" />

    <!-- Header Content -->
    <circle cx="36" cy="34" r="14" fill="#f59e0b" fill-opacity="0.15" />
    <text x="36" y="39" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="14" font-weight="bold">!</text>
    <text x="62" y="30" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">AI Demo / Prototype</text>
    <text x="62" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Controlled Lab Environment (10–15% Total Effort)</text>

    <!-- Row 1: Data -->
    <g transform="translate(24, 88)">
      <rect width="472" height="44" rx="8" fill="#0f172a" fill-opacity="0.6" />
      <text x="14" y="26" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700">Data Environment</text>
      <text x="160" y="26" fill="#cbd5e1" font-family="sans-serif" font-size="12">Clean, static 50-row CSV or curated FAQ sheet</text>
    </g>

    <!-- Row 2: Users & Queries -->
    <g transform="translate(24, 138)">
      <rect width="472" height="44" rx="8" fill="#0f172a" fill-opacity="0.6" />
      <text x="14" y="26" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700">User Base</text>
      <text x="160" y="26" fill="#cbd5e1" font-family="sans-serif" font-size="12">Developers &amp; friendly internal stakeholders</text>
    </g>

    <!-- Row 3: Evaluation -->
    <g transform="translate(24, 188)">
      <rect width="472" height="44" rx="8" fill="#0f172a" fill-opacity="0.6" />
      <text x="14" y="26" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700">Accuracy &amp; Testing</text>
      <text x="160" y="26" fill="#cbd5e1" font-family="sans-serif" font-size="12">20 pre-tested happy-path questions; no edge tests</text>
    </g>

    <!-- Row 4: Integrations -->
    <g transform="translate(24, 238)">
      <rect width="472" height="44" rx="8" fill="#0f172a" fill-opacity="0.6" />
      <text x="14" y="26" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700">System Integration</text>
      <text x="160" y="26" fill="#cbd5e1" font-family="sans-serif" font-size="12">Isolated standalone sandbox; mock APIs</text>
    </g>

    <!-- Row 5: Security & Governance -->
    <g transform="translate(24, 288)">
      <rect width="472" height="44" rx="8" fill="#0f172a" fill-opacity="0.6" />
      <text x="14" y="26" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700">Access &amp; Security</text>
      <text x="160" y="26" fill="#cbd5e1" font-family="sans-serif" font-size="12">Global admin keys, zero RBAC, no PII redaction</text>
    </g>

    <!-- Row 6: Economics & Ops -->
    <g transform="translate(24, 338)">
      <rect width="472" height="44" rx="8" fill="#0f172a" fill-opacity="0.6" />
      <text x="14" y="26" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700">Cost &amp; Failover</text>
      <text x="160" y="26" fill="#cbd5e1" font-family="sans-serif" font-size="12">$15 experimental tokens; manual restart on error</text>
    </g>

    <!-- Left Badge Bottom -->
    <g transform="translate(24, 396)">
      <rect width="472" height="28" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" />
      <text x="236" y="18" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="600">⚠ Risk: False confidence leads to premature launch failure</text>
    </g>
  </g>

  <!-- Right Card: Production AI System -->
  <g transform="translate(620, 140)">
    <!-- Card Base -->
    <rect width="520" height="440" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)" />
    <!-- Header Area -->
    <rect width="520" height="68" rx="16" fill="url(#prodHeader)" />
    <path d="M 0 68 L 520 68" stroke="#334155" stroke-width="1" />

    <!-- Header Content -->
    <circle cx="36" cy="34" r="14" fill="#10b981" fill-opacity="0.15" />
    <text x="36" y="39" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="bold">✓</text>
    <text x="62" y="30" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Production AI System</text>
    <text x="62" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Enterprise Operational Reality (85–90% Total Effort)</text>

    <!-- Row 1: Data -->
    <g transform="translate(24, 88)">
      <rect width="472" height="44" rx="8" fill="#0f172a" fill-opacity="0.6" />
      <text x="14" y="26" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">Data Environment</text>
      <text x="160" y="26" fill="#cbd5e1" font-family="sans-serif" font-size="12">Messy, living ERP/CRM databases with dynamic updates</text>
    </g>

    <!-- Row 2: Users & Queries -->
    <g transform="translate(24, 138)">
      <rect width="472" height="44" rx="8" fill="#0f172a" fill-opacity="0.6" />
      <text x="14" y="26" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">User Base</text>
      <text x="160" y="26" fill="#cbd5e1" font-family="sans-serif" font-size="12">Real customers &amp; stressed employees with vague prompts</text>
    </g>

    <!-- Row 3: Evaluation -->
    <g transform="translate(24, 188)">
      <rect width="472" height="44" rx="8" fill="#0f172a" fill-opacity="0.6" />
      <text x="14" y="26" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">Accuracy &amp; Testing</text>
      <text x="160" y="26" fill="#cbd5e1" font-family="sans-serif" font-size="12">Hundreds of edge cases, injection defense &amp; evaluation suite</text>
    </g>

    <!-- Row 4: Integrations -->
    <g transform="translate(24, 238)">
      <rect width="472" height="44" rx="8" fill="#0f172a" fill-opacity="0.6" />
      <text x="14" y="26" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">System Integration</text>
      <text x="160" y="26" fill="#cbd5e1" font-family="sans-serif" font-size="12">Live bidirectional webhooks, ERP auth, schema validation</text>
    </g>

    <!-- Row 5: Security & Governance -->
    <g transform="translate(24, 288)">
      <rect width="472" height="44" rx="8" fill="#0f172a" fill-opacity="0.6" />
      <text x="14" y="26" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">Access &amp; Security</text>
      <text x="160" y="26" fill="#cbd5e1" font-family="sans-serif" font-size="12">Least privilege, tenant isolation, full audit logs &amp; human oversight</text>
    </g>

    <!-- Row 6: Economics & Ops -->
    <g transform="translate(24, 338)">
      <rect width="472" height="44" rx="8" fill="#0f172a" fill-opacity="0.6" />
      <text x="14" y="26" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">Cost &amp; Failover</text>
      <text x="160" y="26" fill="#cbd5e1" font-family="sans-serif" font-size="12">TCO tracked per task, rate limits, graceful human escalation</text>
    </g>

    <!-- Right Badge Bottom -->
    <g transform="translate(24, 396)">
      <rect width="472" height="28" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
      <text x="236" y="18" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">✓ Outcome: Sustainable, reliable, and measurable business ROI</text>
    </g>
  </g>

  <!-- Bottom Global Takeaway Bar -->
  <g transform="translate(60, 600)">
    <rect width="1080" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="540" y="27" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
      <tspan fill="#38bdf8" font-weight="700">Core Insight:</tspan> An AI model is only 15% of the solution. The other 85% is data architecture, integrations, security, human escalation, and operational monitoring.
    </text>
  </g>
</svg>
