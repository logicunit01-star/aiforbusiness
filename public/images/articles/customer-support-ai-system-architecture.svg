<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(60, 36)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="12" cy="13" r="4" fill="#06b6d4" />
    <text x="24" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">REFERENCE ARCHITECTURE</text>

    <text x="0" y="56" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">Production Customer Support AI System Architecture</text>
    <text x="0" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Separating LLM reasoning from live business APIs, deterministic business rules, and safe human escalation.</text>
  </g>

  <!-- Flowchart Elements -->
  <!-- Left Side: Ingress & Gateway (x: 60) -->
  <g transform="translate(60, 135)">
    <!-- 1. Customer User Interface -->
    <rect width="220" height="120" rx="12" fill="url(#blueCard)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="30" cy="30" r="12" fill="#0284c7" />
    <text x="30" y="35" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">1</text>
    <text x="52" y="34" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700">Customer Touchpoint</text>
    <text x="20" y="66" fill="#cbd5e1" font-family="sans-serif" font-size="12">Web Chat / Mobile / Portal</text>
    <text x="20" y="86" fill="#94a3b8" font-family="sans-serif" font-size="11">e.g. "Where is order #84920?"</text>
    <text x="20" y="104" fill="#64748b" font-family="sans-serif" font-size="10">User session authenticated</text>
  </g>

  <!-- Down Arrow to Auth / Gateway -->
  <path d="M 170 255 L 170 295" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" />
  <polygon points="170,305 165,295 175,295" fill="#38bdf8" />

  <g transform="translate(60, 310)">
    <!-- 2. Security Gateway -->
    <rect width="220" height="145" rx="12" fill="url(#blueCard)" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="30" cy="30" r="12" fill="#4f46e5" />
    <text x="30" y="35" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">2</text>
    <text x="52" y="34" fill="#818cf8" font-family="sans-serif" font-size="14" font-weight="700">Security &amp; Gateway</text>
    <text x="20" y="66" fill="#cbd5e1" font-family="sans-serif" font-size="12">• Identity Verification</text>
    <text x="20" y="86" fill="#cbd5e1" font-family="sans-serif" font-size="12">• RBAC Permission Filter</text>
    <text x="20" y="106" fill="#cbd5e1" font-family="sans-serif" font-size="12">• Prompt Injection Defense</text>
    <text x="20" y="126" fill="#cbd5e1" font-family="sans-serif" font-size="12">• Rate &amp; Token Limiting</text>
  </g>

  <!-- Arrow Gateway -> AI Orchestrator -->
  <path d="M 280 380 L 340 380" stroke="#818cf8" stroke-width="2.5" />
  <polygon points="345,380 335,375 335,385" fill="#818cf8" />

  <!-- Center Layer 3: AI Orchestration Layer (x: 350) -->
  <g transform="translate(350, 135)">
    <rect width="280" height="320" rx="14" fill="url(#blueCard)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)" />
    <!-- Header -->
    <rect width="280" height="52" rx="14" fill="#8b5cf6" fill-opacity="0.15" />
    <circle cx="28" cy="26" r="12" fill="#7c3aed" />
    <text x="28" y="31" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">3</text>
    <text x="48" y="31" fill="#c084fc" font-family="sans-serif" font-size="15" font-weight="700">AI Orchestration Engine</text>

    <!-- Subcomponents -->
    <g transform="translate(18, 68)">
      <rect width="244" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Intent Classifier &amp; Router</text>
      <text x="12" y="38" fill="#94a3b8" font-family="sans-serif" font-size="11">Detects policy vs. transactional query</text>
    </g>

    <g transform="translate(18, 126)">
      <rect width="244" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Context Assembler (Prompt)</text>
      <text x="12" y="38" fill="#94a3b8" font-family="sans-serif" font-size="11">Fuses verified data into strict schema</text>
    </g>

    <g transform="translate(18, 184)">
      <rect width="244" height="52" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
      <text x="12" y="22" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="600">LLM Reasoning Runtime</text>
      <text x="12" y="38" fill="#94a3b8" font-family="sans-serif" font-size="11">Generates grounded candidate draft</text>
    </g>

    <g transform="translate(18, 246)">
      <rect width="244" height="56" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="12" y="20" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="700">STRICT REASONING RULE:</text>
      <text x="12" y="36" fill="#e2e8f0" font-family="sans-serif" font-size="10">Model cannot modify DB directly;</text>
      <text x="12" y="48" fill="#cbd5e1" font-family="sans-serif" font-size="10">Must generate typed function calls only</text>
    </g>
  </g>

  <!-- Connectors to Live Sources (Top / Middle of Orchestrator) -->
  <path d="M 630 200 L 685 200" stroke="#0ea5e9" stroke-width="2" />
  <polygon points="690,200 680,195 680,205" fill="#0ea5e9" />

  <path d="M 630 270 L 685 270" stroke="#10b981" stroke-width="2" />
  <polygon points="690,270 680,265 680,275" fill="#10b981" />

  <!-- Data Sources Stack (x: 695) -->
  <!-- 4A: Knowledge Base / RAG -->
  <g transform="translate(695, 145)">
    <rect width="210" height="100" rx="10" fill="url(#blueCard)" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)" />
    <text x="16" y="26" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">RAG Knowledge Base</text>
    <text x="16" y="46" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Approved Refund Policies</text>
    <text x="16" y="64" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Product Tech Specs &amp; FAQs</text>
    <text x="16" y="82" fill="#94a3b8" font-family="sans-serif" font-size="10">Source: Vector DB (Strict Sync)</text>
  </g>

  <!-- 4B: Live Business APIs -->
  <g transform="translate(695, 260)">
    <rect width="210" height="100" rx="10" fill="url(#blueCard)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)" />
    <text x="16" y="26" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="700">Live Business APIs</text>
    <text x="16" y="46" fill="#cbd5e1" font-family="sans-serif" font-size="11">• ERP &amp; Order Status (Live)</text>
    <text x="16" y="64" fill="#cbd5e1" font-family="sans-serif" font-size="11">• CRM Customer History</text>
    <text x="16" y="82" fill="#94a3b8" font-family="sans-serif" font-size="10">Source: Secure REST / GraphQL</text>
  </g>

  <!-- Arrow Orchestrator -> Business Rules Guardrail (Down to x: 350, y: 475) -->
  <path d="M 490 455 L 490 480" stroke="#c084fc" stroke-width="2.5" />
  <polygon points="490,488 485,478 495,478" fill="#c084fc" />

  <!-- Layer 5: Business Rules & Validation (x: 280, y: 490) -->
  <g transform="translate(280, 490)">
    <rect width="420" height="85" rx="12" fill="url(#blueCard)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="28" cy="26" r="12" fill="#d97706" />
    <text x="28" y="31" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">4</text>
    <text x="48" y="31" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="700">Business Rule Validation &amp; Safety Gate</text>
    <text x="20" y="54" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Checks order ID matches user session (PII isolation)</text>
    <text x="20" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Evaluates confidence score threshold (&gt;0.88) &amp; refund limits</text>
  </g>

  <!-- Decision Splits from Gate (x: 490, y: 575) -->
  <!-- Left Branch: Low Risk Automated Response -->
  <path d="M 700 520 L 950 520 L 950 440" stroke="#10b981" stroke-width="2" />
  <polygon points="950,432 945,442 955,442" fill="#10b981" />

  <!-- Right Branch: Sensitive / Escalation -->
  <path d="M 700 545 L 950 545 L 950 580" stroke="#f59e0b" stroke-width="2" />
  <polygon points="950,588 945,578 955,578" fill="#f59e0b" />

  <!-- Outcome Cards (x: 940) -->
  <!-- Automated Low-Risk Output -->
  <g transform="translate(940, 320)">
    <rect width="200" height="105" rx="10" fill="url(#blueCard)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)" />
    <text x="14" y="24" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">✓ Verified Automation</text>
    <text x="14" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="11">Direct response sent to user:</text>
    <text x="14" y="62" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-style="italic">"Order #84920 shipped via FedEx, tracking #..."</text>
    <text x="14" y="88" fill="#6ee7b7" font-family="sans-serif" font-size="10">80% Repetitive Inquiries Saved</text>
  </g>

  <!-- Human Escalation -->
  <g transform="translate(940, 455)">
    <rect width="200" height="110" rx="10" fill="url(#blueCard)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)" />
    <text x="14" y="24" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700">⚠ Human Escalation</text>
    <text x="14" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="11">Transferred to Support Agent:</text>
    <text x="14" y="62" fill="#e2e8f0" font-family="sans-serif" font-size="10">AI pre-drafts ticket context &amp; summary for fast human resolution</text>
    <text x="14" y="94" fill="#fde68a" font-family="sans-serif" font-size="10">Zero Hallucinations to Customer</text>
  </g>

  <!-- Bottom Telemetry Bar -->
  <g transform="translate(60, 605)">
    <rect width="1080" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="21" r="5" fill="#38bdf8" />
    <text x="36" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
      <tspan fill="#38bdf8" font-weight="700">Continuous Telemetry Layer:</tspan> Every interaction logs full query, retrieved chunks, latency (SLA &lt;1.2s), token cost ($0.008/call), and resolution status into Datadog / OpenTelemetry.
    </text>
  </g>
</svg>
